name: 주간 공모주 뉴스레터 (이메일)

on:
  schedule:
    - cron: "40 23 * * 0"   # 매주 월요일 한국 시간 아침 8:40
  workflow_dispatch:
    inputs:
      test_email:
        description: "시험 발송할 내 이메일 (비우면 구독자 전체에게 보내요)"
        required: false
      force:
        description: "이번 주에 이미 보냈어도 다시 보내기"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: newsletter
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 준비
        run: pip install -q requests
      - name: 뉴스레터 만들고 보내기
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          SUBSCRIBE_URL: ${{ vars.NEWSLETTER_SUBSCRIBE_URL }}
          TEST_EMAIL: ${{ inputs.test_email }}
          FORCE: ${{ inputs.force }}
        run: python newsletter.py
      - name: 보낸 기록 저장
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f newsletter_state.json ] || { echo "기록 파일 없음"; exit 0; }
          git add newsletter_state.json
          if git diff --cached --quiet; then echo "바뀐 기록 없음"; exit 0; fi
          git commit -m "뉴스레터 기록"
          for i in 1 2 3; do
            git pull --rebase -q && git push && exit 0
            sleep 5
          done
          exit 1

# ---- 파일 끝 ----
