name: 공모주 블로그 글 (Blogger)

on:
  schedule:
    - cron: "17 1 * * *"    # 한국 시간 오전 10:17 — 하루 한 번
  workflow_dispatch:

permissions:
  contents: write   # 올린 글 기록(blog_state.json) 저장

concurrency:
  group: blog-post
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 준비
        run: pip install -q requests

      - name: 글 쓰고 올리기
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python blog_post.py

      - name: 올린 기록 저장
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f blog_state.json ] || { echo "기록 파일 없음"; exit 0; }
          git add blog_state.json
          if git diff --cached --quiet; then echo "바뀐 기록 없음"; exit 0; fi
          git commit -m "블로그 글 기록"
          for i in 1 2 3; do
            git pull --rebase -q && git push && exit 0
            sleep 5
          done
          echo "기록 저장 실패"; exit 1

# ---- 파일 끝 ----
