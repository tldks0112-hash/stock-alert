name: 자동 실행 유지 (60일 꺼짐 방지)

on:
  schedule:
    - cron: "17 3 1,15 * *"   # 매달 1일·15일 한국 시간 낮 12:17
  workflow_dispatch:           # 지금 바로 한 번 실행해 보기

permissions:
  contents: write   # 필요할 때 작은 기록 파일을 남기기 위해
  actions: write    # 자동 실행을 다시 켜기 위해

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 자동 실행 모두 다시 켜기 (60일 카운트 초기화)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in .github/workflows/*.yml; do
            name=$(basename "$f")
            if gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${name}/enable" > /dev/null; then
              echo "켜짐 유지: ${name}"
            else
              echo "⚠️ 다시 켜기 실패: ${name}"
            fi
          done

      - name: 마지막 변경이 40일 넘었으면 작은 기록 남기기
        run: |
          days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "저장소 마지막 변경: ${days}일 전"
          if [ "$days" -ge 40 ]; then
            date -u +"%Y-%m-%d %H:%M UTC 자동 실행 유지 기록" > .github/keepalive.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/keepalive.txt
            git commit -m "자동 실행 유지 기록"
            git push
            echo "기록을 남겼어요."
          else
            echo "아직 여유가 있어서 기록은 안 남겼어요."
          fi
