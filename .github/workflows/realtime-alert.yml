name: 정기 작업

on:
  schedule:
    - cron: "4,34 * * * *"                    # 공개 저장소일 때: 30분마다 (예비용. 5분 실행은 서버 타이머가 맡아요)
    - cron: "1,16,31,46 0-6,13-21 * * 1-5"    # 비공개일 때: 평일 장중 15분마다
    - cron: "1,31 7-12,22-23 * * 1-5"         # 비공개일 때: 평일 그 밖 30분마다
    - cron: "1,31 * * * 0,6"                  # 비공개일 때: 주말 30분마다
  workflow_dispatch:
    inputs:
      tick:
        description: "서버 타이머가 부를 때만 켜져요. 손으로 돌릴 땐 그대로 두세요."
        type: boolean
        default: false

concurrency:
  group: realtime-alert
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    # 공개 저장소면 30분 예비 일정만, 비공개면 느린 일정만 실제로 돌아요. (서버 타이머는 5분마다 따로 불러요)
    # 맞지 않는 일정은 바로 '건너뜀' 처리돼서 요금이 들지 않아요.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.repository.private == false && github.event.schedule == '4,34 * * * *') ||
      (github.event.repository.private == true && github.event.schedule != '4,34 * * * *')
    runs-on: ${{ github.event.repository.private && 'ubuntu-slim' || 'ubuntu-latest' }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 준비
        run: pip install -q yfinance pandas requests pywebpush

      - name: 기록 불러오기
        uses: actions/cache/restore@v4
        with:
          path: .alert_state
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-

      - name: 실행
        env:
          ALERT_SETTINGS: ${{ secrets.ALERT_SETTINGS }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          NEW_REFRESH_TOKEN_FILE: ${{ runner.temp }}/new_refresh_token
          FORCE: ${{ github.event_name == 'workflow_dispatch' && !inputs.tick && '1' || '0' }}   # 손으로 돌릴 때만 장 시간 무시
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          NAVER_API_KEY_ID: ${{ secrets.NAVER_API_KEY_ID }}   # 네이버 뉴스 검색 (없으면 구글 뉴스)
          NAVER_API_KEY: ${{ secrets.NAVER_API_KEY }}
          TOSS_CLIENT_ID: ${{ secrets.TOSS_CLIENT_ID }}             # 토스증권 보유 자동 반영 (없으면 안 씀)
          TOSS_CLIENT_SECRET: ${{ secrets.TOSS_CLIENT_SECRET }}
          FIXIE_URL: ${{ secrets.FIXIE_URL }}                       # 고정 IP 중계 (토스 허용 IP)
          GMAIL_USER: ${{ secrets.GMAIL_USER }}                 # 의견 답글 메일 (없으면 앱에서만 보임)
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python realtime_alert.py

      - name: 기록 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .alert_state
          key: alert-state-${{ github.run_id }}

      - name: 토큰 저장
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TOKEN_FILE: ${{ runner.temp }}/new_refresh_token
        run: |
          if [ -s "$TOKEN_FILE" ]; then
            gh secret set KAKAO_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < "$TOKEN_FILE"
            rm -f "$TOKEN_FILE"
            echo "토큰 저장 완료"
          fi

# ---- 파일 끝 ----
