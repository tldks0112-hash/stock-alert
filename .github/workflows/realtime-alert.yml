name: 정기 작업

on:
  schedule:
    - cron: "2-59/5 * * * *"                  # 공개 저장소일 때: 5분마다
    - cron: "1,16,31,46 0-6,13-21 * * 1-5"    # 비공개일 때: 평일 장중 15분마다
    - cron: "1,31 7-12,22-23 * * 1-5"         # 비공개일 때: 평일 그 밖 30분마다
    - cron: "1,31 * * * 0,6"                  # 비공개일 때: 주말 30분마다
  workflow_dispatch:

concurrency:
  group: realtime-alert
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    # 공개 저장소면 5분 일정만, 비공개면 느린 일정만 실제로 돌아요.
    # 맞지 않는 일정은 바로 '건너뜀' 처리돼서 요금이 들지 않아요.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.repository.private == false && github.event.schedule == '2-59/5 * * * *') ||
      (github.event.repository.private == true && github.event.schedule != '2-59/5 * * * *')
    runs-on: ${{ github.event.repository.private && 'ubuntu-slim' || 'ubuntu-latest' }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 준비
        run: pip install -q yfinance pandas requests

      - name: 기록 불러오기
        uses: actions/cache/restore@v4
        with:
          path: .alert_state
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-

      - name: 실행
        env:
          ALERT_SETTINGS: ${{ secrets.ALERT_SETTINGS }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          NEW_REFRESH_TOKEN_FILE: ${{ runner.temp }}/new_refresh_token
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python realtime_alert.py

      - name: 기록 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .alert_state
          key: alert-state-${{ github.run_id }}

      - name: 토큰 저장
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TOKEN_FILE: ${{ runner.temp }}/new_refresh_token
        run: |
          if [ -s "$TOKEN_FILE" ]; then
            pip install -q pynacl
            python - <<'PY'
          import base64, os, requests
          from nacl import encoding, public
          repo, tok = os.environ["GITHUB_REPOSITORY"], os.environ["GH_TOKEN"]
          h = {"Authorization": f"Bearer {tok}", "Accept": "application/vnd.github+json",
               "X-GitHub-Api-Version": "2022-11-28"}
          k = requests.get(f"https://api.github.com/repos/{repo}/actions/secrets/public-key", headers=h, timeout=10).json()
          box = public.SealedBox(public.PublicKey(k["key"].encode(), encoding.Base64Encoder()))
          value = open(os.environ["TOKEN_FILE"]).read().strip()
          enc = base64.b64encode(box.encrypt(value.encode())).decode()
          r = requests.put(f"https://api.github.com/repos/{repo}/actions/secrets/KAKAO_REFRESH_TOKEN",
                           headers=h, json={"encrypted_value": enc, "key_id": k["key_id"]}, timeout=10)
          r.raise_for_status()
          print("토큰 저장 완료")
          PY
            rm -f "$TOKEN_FILE"
          fi
