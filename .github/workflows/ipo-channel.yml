name: 공모주 청약 알림 (텔레그램 채널)

on:
  schedule:
    - cron: "7 23 * * *"    # 한국 시간 아침 8:07 — 오늘 시작·마감, 월요일엔 주간 일정
    - cron: "37 3 * * *"    # 낮 12:37 — 새 일정, 공모가 확정
    - cron: "37 9 * * *"    # 저녁 6:37 — 청약 경쟁률
  workflow_dispatch:
    inputs:
      weekly:
        description: "주간 일정 글을 지금 바로 올리기"
        type: boolean
        default: false
      intro:
        description: "채널 소개 글 올리기 (처음 한 번)"
        type: boolean
        default: false

permissions:
  contents: write   # 이미 올린 글 기록(ipo_state.json) 저장

concurrency:
  group: ipo-channel
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 준비
        run: pip install -q requests

      - name: 공모주 확인하고 채널에 올리기
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          PROMO_TEXT: ${{ vars.IPO_PROMO_TEXT }}
          FORCE_WEEKLY: ${{ inputs.weekly }}
          INTRO_POST: ${{ inputs.intro }}
        run: python ipo_channel.py

      - name: 올린 기록 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f ipo_state.json ] || { echo "기록 파일 없음"; exit 0; }
          git add ipo_state.json
          if git diff --cached --quiet; then echo "바뀐 기록 없음"; exit 0; fi
          git commit -m "공모주 알림 기록"
          for i in 1 2 3; do
            git pull --rebase -q && git push && exit 0
            sleep 5
          done
          echo "기록 저장 실패"; exit 1

# ---- 파일 끝 ----
