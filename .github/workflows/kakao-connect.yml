name: 카카오 연결 (처음 한 번)

on:
  workflow_dispatch:
    inputs:
      code:
        description: "카카오 동의 후 주소창의 주소 전체 (또는 code= 뒤의 값)"
        required: true

permissions:
  contents: read

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 프로그램 준비
        run: pip install -q yfinance pandas requests

      - name: 카카오 토큰 받고 테스트 카톡 보내기
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          CODE: ${{ inputs.code }}
          NEW_REFRESH_TOKEN_FILE: ${{ runner.temp }}/new_refresh_token
        run: python signal_alert.py connect "$CODE"

      - name: 토큰을 GitHub 비밀값으로 저장
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TOKEN_FILE: ${{ runner.temp }}/new_refresh_token
        run: |
          test -s "$TOKEN_FILE" || { echo "카카오 토큰을 받지 못했어요."; exit 1; }
          gh secret set KAKAO_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < "$TOKEN_FILE"
          rm -f "$TOKEN_FILE"
          echo "연결 완료! 이제 매일 아침 카톡으로 신호가 와요."
