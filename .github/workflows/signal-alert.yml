name: 매매 신호 알림

on:
  schedule:
    - cron: "30 22 * * 1-5"   # 한국 시간 화~토 오전 7:30 (미국 장 마감 후). GitHub 사정으로 조금 늦을 수 있어요.
  workflow_dispatch:           # 휴대폰 GitHub 앱에서 'Run workflow'로 지금 바로 받기

permissions:
  contents: read

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 프로그램 준비
        run: pip install -q yfinance pandas requests

      - name: 신호 계산하고 카톡 보내기
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          NEW_REFRESH_TOKEN_FILE: ${{ runner.temp }}/new_refresh_token
        run: python signal_alert.py

      - name: 새 카카오 토큰 저장 (한 달에 한 번 정도 생겨요)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TOKEN_FILE: ${{ runner.temp }}/new_refresh_token
        run: |
          if [ -s "$TOKEN_FILE" ]; then
            gh secret set KAKAO_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < "$TOKEN_FILE"
            rm -f "$TOKEN_FILE"
            echo "카카오 토큰을 새것으로 저장했어요."
          fi
